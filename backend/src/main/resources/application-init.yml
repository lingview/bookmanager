server:
  port: 0

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
app:
  mode: init
logging:
  level:
    root: INFO
    xyz.lingview.astra: DEBUG

management:
  health:
    redis:
      enabled: false